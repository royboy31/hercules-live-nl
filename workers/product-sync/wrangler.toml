# Hercules NL — product-sync worker, STAGING lane.
# NL resources only. Never point this at an FR/DE/UK store, KV or repo.
name = "hercules-product-sync-nl"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# NL WordPress origin (temporary build hostname until hercules-merchandise.nl is live)
WC_STORE_URL = "https://staging.hercules-merchandise.nl"
WORKER_BASE_URL = "https://hercules-product-sync-nl.gilles-86d.workers.dev"
# WEBHOOK_SECRET is a secret: `wrangler secret put WEBHOOK_SECRET` (not a var, unlike FR)
GITHUB_OWNER = "royboy31"
GITHUB_REPO = "hercules-live-nl"
GITHUB_WORKFLOW = "deploy.yml"
GITHUB_REF = "main"
ASTRO_SITE_URL = "https://hercules-nl-staging.pages.dev"
# CLOUDFLARE_ZONE_ID: set once the hercules-merchandise.nl zone exists (Phase 1, Gilles)

[[r2_buckets]]
binding = "CLIENT_LOGOS_BUCKET"
bucket_name = "hercules-nl-client-logos"

[triggers]
crons = ["0 4 * * *"]

[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "434b874bd8814f1680ea1e44c618cd73"   # hercules-nl-products (staging)
