# Hercules NL — edge router, PRODUCTION lane.
# No [[routes]] yet: the hercules-merchandise.nl zone does not exist. Routes go on the
# .nl zone ONLY — never on hercules-merchandising.fr or any other live zone.
name = "hercules-edge-router-nl-prod"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# NO "global_fetch_strictly_public": on a zone route it makes the self-fetch re-enter the Worker
# (every WP path 503, seen on the staging lane 2026-09-17). Without a route this lane's WP
# paths do not work from workers.dev - the frontend is the routed staging host.

[vars]
ASTRO_ORIGIN = "https://hercules-nl.pages.dev"
WORDPRESS_ORIGIN = "https://hercules-merchandise.nl"
PRODUCT_SYNC_WORKER_URL = "https://hercules-product-sync-nl-prod.gilles-86d.workers.dev"

# [[routes]]
# pattern = "hercules-merchandise.nl/*"
# zone_name = "hercules-merchandise.nl"
