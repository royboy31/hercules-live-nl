# Hercules NL — edge router, STAGING lane.
# No [[routes]] yet: the hercules-merchandise.nl zone does not exist. Routes go on the
# .nl zone ONLY — never on hercules-merchandising.fr or any other live zone.
name = "hercules-edge-router-nl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# workers.dev -> workers.dev fetches inside one account are refused (error 1042) unless they go
# out as public requests. FR never hits this: its router runs on a custom-domain route.
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
ASTRO_ORIGIN = "https://hercules-nl-staging.pages.dev"
WORDPRESS_ORIGIN = "https://nl.hercules-merchandising.fr"
PRODUCT_SYNC_WORKER_URL = "https://hercules-product-sync-nl.gilles-86d.workers.dev"

# [[routes]]
# pattern = "staging.hercules-merchandise.nl/*"
# zone_name = "hercules-merchandise.nl"
