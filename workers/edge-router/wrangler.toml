# Hercules NL — edge router, STAGING lane.
# Fronts staging.hercules-merchandise.nl the way FR's router fronts staging.hercules-merchandising.fr:
# Astro pages from Pages, WordPress paths proxied to the NL clone on the same host. The old
# nl.hercules-merchandising.fr route (FR zone, host-scoped on purpose) only redirects now.
name = "hercules-edge-router-nl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# NO "global_fetch_strictly_public" here (FR has none either). It was needed while this lane
# lived on workers.dev only, but on a zone route it makes the fetch to WORDPRESS_ORIGIN (our own
# hostname) re-enter this Worker instead of going to the origin -> every WP path 503
# "compute server error" (seen 2026-09-17). Same-zone fetches skip the route by default.

[vars]
ASTRO_ORIGIN = "https://hercules-nl-staging.pages.dev"
WORDPRESS_ORIGIN = "https://staging.hercules-merchandise.nl"
PRODUCT_SYNC_WORKER_URL = "https://hercules-product-sync-nl.gilles-86d.workers.dev"
# Same trick as FR's router: resolve the WordPress origin straight to the server IP (grey-cloud
# `origin` record on the .nl zone) so Cloudflare never re-enters the route or APO-caches WP HTML.
# The Host header stays staging.hercules-merchandise.nl, so Plesk serves the NL vhost.
ORIGIN_RESOLVE_HOST = "origin.hercules-merchandise.nl"

# Real staging host on the NL zone (zone hercules-merchandise.nl, in the same account).
[[routes]]
pattern = "staging.hercules-merchandise.nl/*"
zone_name = "hercules-merchandise.nl"

# Temporary host on the FR zone: the Worker 301s it to the staging host (see src/index.ts).
# Remove this route + the nl A record once nothing links to it any more.
[[routes]]
pattern = "nl.hercules-merchandising.fr/*"
zone_name = "hercules-merchandising.fr"
